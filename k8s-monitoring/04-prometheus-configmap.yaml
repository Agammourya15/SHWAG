apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  # ─────────────────────────────────────────────
  # prometheus.yml — Main Prometheus configuration
  # ─────────────────────────────────────────────
  prometheus.yml: |
    global:
      scrape_interval: 30s        # Probe every 30 seconds
      evaluation_interval: 30s    # Evaluate alert rules every 30 seconds
      scrape_timeout: 15s

    # Reference to alerting rules file
    rule_files:
      - /etc/prometheus/alert-rules.yml

    scrape_configs:
      # ── 1. Prometheus scrapes itself ──
      - job_name: 'prometheus-self'
        static_configs:
          - targets: ['localhost:9090']

      # ── 2. Blackbox Exporter self-metrics ──
      - job_name: 'blackbox-exporter-self'
        static_configs:
          - targets: ['blackbox-exporter:9115']

      # ── 3. SHWAG Frontend (React/Vite) — HTTPS Production URL ──
      #    Monitors your live deployed Vercel frontend
      - job_name: 'shwag-frontend-production'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              # Replace with your actual Vercel URL:
              - https://shwag.vercel.app
              # You can add more domains here
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115

      # ── 4. SHWAG Backend API — Production (Render/Railway URL) ──
      - job_name: 'shwag-backend-production'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              # Replace with your actual backend URL:
              - https://shwag-backend.onrender.com
              # Add the health check route if you have one:
              # - https://your-backend.onrender.com/api/products
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115

      # ── 5. SHWAG Local Development URLs (via host.docker.internal) ──
      #    host.docker.internal → reaches your Windows host machine
      #    Frontend: http://localhost:5173 → http://host.docker.internal:5173
      #    Backend:  http://localhost:5000 → http://host.docker.internal:5000
      - job_name: 'shwag-local-frontend'
        metrics_path: /probe
        params:
          module: [http_2xx_skip_ssl]
        static_configs:
          - targets:
              - http://host.docker.internal:5173
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115

      - job_name: 'shwag-local-backend'
        metrics_path: /probe
        params:
          module: [http_2xx_skip_ssl]
        static_configs:
          - targets:
              - http://host.docker.internal:5000
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115

  # ─────────────────────────────────────────────
  # alert-rules.yml — Alerting rules for SHWAG
  # ─────────────────────────────────────────────
  alert-rules.yml: |
    groups:
      - name: shwag-website-alerts
        interval: 30s
        rules:

          # ALERT 1: Website is completely DOWN
          - alert: SHWAGWebsiteDown
            expr: probe_success == 0
            for: 1m
            labels:
              severity: critical
              project: shwag
            annotations:
              summary: "🔴 SHWAG: {{ $labels.instance }} is DOWN"
              description: |
                The website {{ $labels.instance }} has been unreachable for more than 1 minute.
                Job: {{ $labels.job }}
                Time: Check Grafana for timeline.

          # ALERT 2: Slow HTTP response (> 2 seconds)
          - alert: SHWAGSlowResponse
            expr: probe_duration_seconds > 2
            for: 5m
            labels:
              severity: warning
              project: shwag
            annotations:
              summary: "🟡 SHWAG: Slow response from {{ $labels.instance }}"
              description: |
                {{ $labels.instance }} is responding slowly.
                Current response time: {{ $value | printf "%.2f" }}s (threshold: 2s)
                This could mean server overload or network issues.

          # ALERT 3: HTTP 4xx or 5xx Error
          - alert: SHWAGHTTPError
            expr: probe_http_status_code >= 400
            for: 1m
            labels:
              severity: critical
              project: shwag
            annotations:
              summary: "🔴 SHWAG: HTTP Error {{ $value }} at {{ $labels.instance }}"
              description: |
                {{ $labels.instance }} is returning HTTP {{ $value }}.
                4xx = Client error (bad URL, auth issue)
                5xx = Server crash or misconfiguration

          # ALERT 4: SSL certificate expiring within 14 days
          - alert: SHWAGSSLCertExpiringSoon
            expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
            for: 1h
            labels:
              severity: warning
              project: shwag
            annotations:
              summary: "⚠️ SHWAG: SSL cert expiring for {{ $labels.instance }}"
              description: |
                SSL certificate for {{ $labels.instance }} expires in {{ $value | printf "%.0f" }} days.
                Renew immediately to avoid HTTPS failures.

          # ALERT 5: High DNS resolution time
          - alert: SHWAGHighDNSLatency
            expr: probe_dns_lookup_time_seconds > 1
            for: 5m
            labels:
              severity: warning
              project: shwag
            annotations:
              summary: "🟡 SHWAG: High DNS latency for {{ $labels.instance }}"
              description: |
                DNS lookup for {{ $labels.instance }} is taking {{ $value | printf "%.2f" }}s.
                Normal should be < 0.1s. Check DNS configuration.
