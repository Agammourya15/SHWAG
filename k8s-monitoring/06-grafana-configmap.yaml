apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  # This file is auto-loaded by Grafana on startup
  # It automatically connects Grafana to Prometheus — no manual setup needed!
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090   # Internal K8s DNS name
        isDefault: true
        editable: true
        jsonData:
          timeInterval: "30s"         # Matches Prometheus scrape interval
          queryTimeout: "60s"
          httpMethod: "POST"
