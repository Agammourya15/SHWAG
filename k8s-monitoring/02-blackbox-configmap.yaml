apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: monitoring
data:
  blackbox.yml: |
    modules:
      # Module: Check if HTTPS website returns 2xx status
      http_2xx:
        prober: http
        timeout: 15s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: []          # Empty = accept all 2xx responses
          method: GET
          follow_redirects: true
          preferred_ip_protocol: ip4
          tls_config:
            insecure_skip_verify: false   # Validate SSL certs (set true to skip)

      # Module: Check plain HTTP (no SSL) - used for localhost/LAN targets
      http_2xx_skip_ssl:
        prober: http
        timeout: 15s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: []
          method: GET
          follow_redirects: true
          preferred_ip_protocol: ip4
          tls_config:
            insecure_skip_verify: true    # Skip SSL check for local HTTP

      # Module: Check API endpoint (POST support, auth-friendly)
      http_api:
        prober: http
        timeout: 10s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: [200, 201]
          method: GET
          follow_redirects: true
          preferred_ip_protocol: ip4

      # Module: TCP port check (good for MongoDB, Redis etc)
      tcp_connect:
        prober: tcp
        timeout: 10s
